<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tworzenie Stron WWW</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background-image:url("spartan.jpg");
    background-size:cover;
    background-position:center;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

header h1{
    font-size:60px;
    text-shadow:2px 2px 10px black;
}

header p{
    font-size:24px;
    margin-top:15px;
    text-shadow:2px 2px 10px black;
}

section{
    max-width:1000px;
    margin:auto;
    padding:60px 20px;
}

h2{
    margin-bottom:20px;
}

.card{
    background:white;
    padding:25px;
    margin:20px 0;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

.price{
    font-size:50px;
    color:green;
    text-align:center;
    font-weight:bold;
}

.contact{
    text-align:center;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
}

</style>
</head>

<header>
    <h1>Tworzę Strony Internetowe</h1>

</header>

<section>

    <div class="card">
        ✅ Strona wizytówka dla firmy
    </div>

    <div class="card">
        ✅ Responsywny wygląd na telefon i komputer
    </div>

    <div class="card">
        ✅ Szybka realizacja
    </div>

    <div class="card">
        ✅ Indywidualny projekt
    </div>
</section>

<section>
    <h2>Cena</h2>
    <p class="price">100 zł</p>
</section>

<section class="contact">
    <h2>Kontakt</h2>
    <p>Discord: TWOJ_DISCORD</p>
    <p>Email: twojemail@gmail.com</p>
</section>

<footer>
    © 2026 Tworzenie Stron WWW
</footer>

</html>
